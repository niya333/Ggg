<!DOCTYPE html> <html lang="zh-CN"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>测测你的本命定居城市｜你最适合在哪长期定居？</title> <script src="https://cdn.tailwindcss.com"></script> <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet"> <script> tailwind.config = { theme: { extend: { colors: { morandi: { pink: '#E8D8D6', blue: '#D7E0E8', green: '#D8E2DD', beige: '#F2ECE6', gray: '#BFB8B5', text: '#5C5450' } }, fontFamily: { sans: ['system-ui', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'sans-serif'] } } } } </script> <style type="text/tailwindcss"> @layer utilities { .card-shadow { box-shadow: 0 6px 18px rgba(191, 184, 181, 0.18); } .btn-hover { transition: all 0.24s ease; } .btn-hover:hover { transform: translateY(-2px); } } body { background-color: #F2ECE6; } </style> </head> <body class="min-h-screen text-morandi-text"> <div class="max-w-md mx-auto px-5 py-8"> <!-- 封面页 --> <div id="page-cover" class="block"> <div class="bg-white rounded-3xl p-7 card-shadow"> <h1 class="text-[22px] font-medium text-center leading-relaxed">测测你的本命定居城市</h1> <p class="text-[15px] text-center mt-1 opacity-80">你最适合在哪长期定居？</p> <div class="my-6 h-[1px] bg-morandi-gray/30"></div> <p class="text-[14.5px] leading-relaxed"> 不搞玄学✨ 偏向现实宜居向<br> 从气候、节奏、饮食、社交、生活成本等偏好出发<br> 15道小选择题，找到和你适配度最高的定居地 </p> <div class="mt-8"> <button onclick="startTest()" class="w-full py-3 rounded-2xl bg-morandi-pink text-white font-medium btn-hover"> 开始测试 </button> </div> <p class="text-[12px] text-center mt-4 opacity-60">共15题 · 预计2分钟完成</p> </div> </div> <!-- 答题区域 --> <div id="page-question" class="hidden"> <div class="bg-white rounded-3xl p-7 card-shadow"> <div class="flex justify-between items-center mb-4"> <span class="text-[13px]">进度 <span id="q-index">1</span>/15</span> <div class="w-28 h-1.5 bg-morandi-beige rounded-full overflow-hidden"> <div id="progress-bar" class="h-full bg-morandi-pink w-[6.6%]"></div> </div> </div> <h2 id="q-title" class="text-[17px] font-medium leading-relaxed min-h-[52px]"></h2> <div class="mt-6 space-y-3" id="option-box"> <!-- 选项JS渲染 --> </div> <div class="mt-7"> <button id="next-btn" onclick="nextQuestion()" disabled class="w-full py-3 rounded-2xl bg-morandi-blue text-white font-medium btn-hover disabled:opacity-40 disabled:cursor-not-allowed"> 下一题 </button> </div> </div> </div> <!-- 结果页 --> <div id="page-result" class="hidden"> <div class="bg-white rounded-3xl p-7 card-shadow"> <div class="text-center"> <p class="text-[14px] opacity-70">✨你的本命定居城市✨</p> <h2 id="city-name" class="text-[24px] font-medium mt-2"></h2> </div> <div class="my-6 h-[1px] bg-morandi-gray/30"></div> <div id="city-desc" class="text-[14.5px] leading-relaxed space-y-3"> </div> <div class="mt-8"> <button onclick="restartTest()" class="w-full py-3 rounded-2xl bg-morandi-pink text-white font-medium btn-hover"> 重新测试 </button> </div> <p class="text-[12px] text-center mt-4 opacity-60">适合截图保存 · 分享给朋友测测</p> </div> </div> </div> <script> // 15道题目，每题4个选项，选项携带分值A/B/C/D，用来匹配城市 const questions = [ { title: "你更喜欢哪种气候？", opts: [ {txt:"四季分明，有冷有热", score:"A"}, {txt:"常年温暖，冬天不冷", score:"B"}, {txt:"干爽少雨，不喜欢潮湿", score:"C"}, {txt:"温润多雨，空气湿润", score:"D"} ] }, { title: "日常通勤节奏你更接受？", opts: [ {txt:"可以接受长通勤，机会优先", score:"A"}, {txt:"通勤30分钟内最好，平衡生活", score:"B"}, {txt:"短途骑行步行，慢节奏优先", score:"C"}, {txt:"居家为主，通勤无所谓", score:"D"} ] }, { title: "美食口味偏好？", opts: [ {txt:"重油重辣，烟火气强", score:"A"}, {txt:"清淡鲜甜，原生本味", score:"B"}, {txt:"面食牛羊肉，西北风味", score:"C"}, {txt:"海鲜丰富，小吃多样", score:"D"} ] }, { title: "能不能接受潮湿回南天？", opts: [ {txt:"勉强可以，做好除湿就行", score:"A"}, {txt:"不太喜欢，尽量避开", score:"B"}, {txt:"完全不行，偏爱干燥", score:"C"}, {txt:"很适应潮湿湿润环境", score:"D"} ] }, { title: "休闲时偏爱？", opts: [ {txt:"热闹商圈，展览活动多", score:"A"}, {txt:"市井老街，小店咖啡馆", score:"B"}, {txt:"山野湖泊，自然风光", score:"C"}, {txt:"海边散步，松弛放空", score:"D"} ] }, { title: "城市氛围，热闹or安静？", opts: [ {txt:"繁华热闹，人多包容", score:"A"}, {txt:"动静平衡，闹中取静", score:"B"}, {txt:"安静松弛，人少不拥挤", score:"C"}, {txt:"小众安逸，熟人氛围", score:"D"} ] }, { title: "对收入和发展机会的期待？", opts: [ {txt:"高薪机会多，愿意拼事业", score:"A"}, {txt:"收入稳定，稳步上升即可", score:"B"}, {txt:"够用就好，不卷高薪", score:"C"}, {txt:"低压力，收入要求不高", score:"D"} ] }, { title: "一年里你最喜欢哪个季节？", opts: [ {txt:"秋天，凉爽干爽", score:"A"}, {txt:"春天，温和多雨", score:"B"}, {txt:"夏天，阳光充足", score:"C"}, {txt:"冬天，喜欢暖阳", score:"D"} ] }, { title: "你对城市包容度的需求？", opts: [ {txt:"高度包容，多元开放", score:"A"}, {txt:"比较包容，外地人友好", score:"B"}, {txt:"温和包容，节奏保守", score:"C"}, {txt:"熟人社会，安稳简单", score:"D"} ] }, { title: "住房成本接受度？", opts: [ {txt:"可以承担高房价，换取资源", score:"A"}, {txt:"中等房价，压力可控", score:"B"}, {txt:"低房价，生活成本友好", score:"C"}, {txt:"优先租房，不考虑买房", score:"D"} ] }, { title: "闲暇出行偏好？", opts: [ {txt:"高铁飞机方便，去哪都快", score:"A"}, {txt:"周边短途自驾", score:"B"}, {txt:"近郊爬山徒步", score:"C"}, {txt:"家门口海边湖边发呆", score:"D"} ] }, { title: "社交模式？", opts: [ {txt:"社交丰富，经常认识新人", score:"A"}, {txt:"少量好友，舒服社交", score:"B"}, {txt:"低社交，享受独处", score:"C"}, {txt:"家人陪伴优先", score:"D"} ] }, { title: "蚊虫、梅雨季你怎么看？", opts: [ {txt:"能忍受，问题不大", score:"A"}, {txt:"有点介意，尽量少", score:"B"}, {txt:"很怕潮湿蚊虫", score:"C"}, {txt:"习惯了，不影响心情", score:"D"} ] }, { title: "语言&生活习惯差异接受度？", opts: [ {txt:"完全OK，适应力很强", score:"A"}, {txt:"可以适应，慢慢融入", score:"B"}, {txt:"偏好语言相近、习俗熟悉", score:"C"}, {txt:"希望和原生环境接近", score:"D"} ] }, { title: "长期定居，你最看重哪一项？", opts: [ {txt:"就业与发展上限", score:"A"}, {txt:"生活配套便利度", score:"B"}, {txt:"自然环境空气质量", score:"C"}, {txt:"松弛感和情绪稳定", score:"D"} ] } ]; // 50个城市结果：国内25｜国外25，小红书风格文案 const cityResult = [ // ========== 国内25 ========== { name:"杭州", desc:"🌿 宜居亮点：半城山水半城烟火，西湖、茶山、运河都在身边，互联网机会充足，咖啡馆、书店、展览密度很高。城市温和包容，江浙菜系清甜，城市基建完善。\n✅适合：喜欢动静平衡、想搞事业又不想彻底丢失生活感，审美细腻、偏爱江南氛围的人。\n⚠️小缺点：房价偏高，梅雨季潮湿难熬，高峰期通勤拥堵。" }, { name:"成都", desc:"🌿 宜居亮点：松弛感天花板！美食选择巨多，火锅、串串、小吃遍地，生活节奏慢，本地人热情，公园城市建设很好，物价友好。\n✅适合：爱吃辣、讨厌高强度内卷，喜欢市井烟火，愿意慢悠悠过日子的人。\n⚠️小缺点：常年阴天多日照少，冬季湿冷，高薪岗位集中在少数行业。" }, { name:"昆明", desc:"🌿 宜居亮点：春城名不虚传，全年气温舒服，鲜花自由，日照充足，空气好，周边可以去大理、丽江短途玩。\n✅适合：讨厌酷暑严寒、重视空气质量，喜欢慢悠悠生活，不想被气候折磨的人。\n⚠️小缺点：经济岗位偏少，海拔略高，紫外线很强，干燥风大。" }, { name:"厦门", desc:"🌿 宜居亮点：滨海小城氛围感拉满 e:"南宁", desc:"🌿 宜居亮点：绿城满城绿植，水果自由，物价友好，东南亚风味美食多。\n✅适合：爱吃热带水果，喜欢常绿环境，适应湿热气候，喜欢悠闲生活的人。\n⚠️小缺点：夏天漫长湿热，蚊虫多，发展上限有限。" }, { name:"银川", desc:"🌿 宜居亮点：塞上湖城，干爽少雨，日照充足，黄河风光，羊肉面食超香。\n✅适合：极度讨厌潮湿回南天，偏爱干爽气候，喜欢西北风味的人。\n⚠️小缺点：冬季寒冷干燥，远离沿海，机会偏少。" }, { name:"济南", desc:"🌿 宜居亮点：泉城，老城泉水温柔，鲁菜扎实，物价友好，四季分明。\n✅适合：适应四季冷暖，喜欢北方踏实烟火，追求安稳生活的人。\n⚠️小缺点：夏天闷热，老城区拥堵，干燥扬尘偶有。" }, { name:"惠州", desc:"🌿 宜居亮点：广东宝藏滨海，海水干净，房价友好，离深圳很近，海鲜实惠。\n✅适合：想靠近大湾区机会，但不想承担深圳高房价，喜欢海边的人。\n⚠️小缺点：配套不均衡，旺季人多，夏季台风。" }, { name:"泉州", desc:"🌿 宜居亮点：世遗古城，红砖古厝，古早味小吃遍地，闽南生活慢悠悠，人情味浓。\n✅适合：喜欢古城烟火、历史街巷，偏爱慢悠悠本土生活感的人。\n⚠️小缺点：产业偏传统，新潮文娱少，夏天湿热。" }, { name:"深圳", desc:"🌿 宜居亮点：一线机会高地，城市年轻包容，绿化很好，海边公园多，全国各地美食都能找到。\n✅适合：事业心强，愿意奋斗，看重多元包容，想抓住行业机会的人。\n⚠️小缺点：房价极高，节奏飞快，人多拥挤，夏天漫长湿热。" }, // ========== 国外25 ========== { name:"清迈", desc:"🌿 宜居亮点：泰北小城，物价很低，绿植茂密，节奏慢悠悠，咖啡馆遍地，阳光温柔。\n✅适合：追求低成本松弛旅居，喜欢热带绿植，不爱高压竞争，喜欢慢生活的人。\n⚠️小缺点：医疗上限有限，语言障碍，雨季多雨蚊虫多。" }, { name:"温哥华", desc:"🌿 宜居亮点：森林雪山大海同框，华人社区成熟，中餐丰富，气候温和湿润。\n✅适合：喜欢自然风光，重视环境，想要多元包容城市，能接受多雨冬季的人。\n⚠️小缺点：房价昂贵，冬天长期阴雨，物价偏高。" }, { name:"奥克兰", desc:"🌿 宜居亮点：新西兰，海湾火山，植被茂密，人口密度低，节奏舒缓，空气绝佳。\n✅适合：极度看重自然环境，喜欢安静低拥挤，愿意远离喧嚣的人。\n⚠️小缺点：离其他城市很远，就业选择少，物价偏高。" }, { name:"里斯本", desc:"🌿 宜居亮点：葡萄牙暖阳老城，黄电车、海岸线，物价在欧洲友好，节奏慵懒。\n✅适合：喜欢南欧阳光老城，热爱慢节奏，偏爱文艺复古氛围的人。\n⚠️小缺点：薪资水平偏低，夏季游客很多。" }, { name:"墨尔本", desc:"🌿 宜居亮点：文艺咖啡之都，巷弄涂鸦、花园超多，城市包容，近郊山海都有。\n✅适合：审美丰富，喜欢艺文活动，愿意接受多变天气，热爱咖啡文化的人。\n⚠️小缺点：一天四季天气飘忽，城市面积大通勤久。" }, { name:"布里斯班", desc:"🌿 宜居亮点：澳洲阳光城市，温暖少冷，离黄金海岸很近，生活压力小于悉尼墨尔本。\n✅适合：热爱长久阳光，喜欢亚热带气候，偏爱轻松海滨氛围的人。\n⚠️小缺点：文娱资源偏少，夏季闷热。" }, { name:"京都", desc:"🌿 宜居亮点：古寺街巷，四季风物绝美，饮食精致，安静有序，氛围感拉满。\n✅适合：喜欢日式安静美学，偏爱秩序感，热爱四季风景、清淡美食的人。\n⚠️小缺点：生活成本偏高，节奏压抑，社交偏内敛。" }, { name:"釜山", desc:"🌿 宜居亮点：韩国海滨，海鲜市集，海风街巷，比首尔松弛很多，美食密集。\n✅适合：喜欢韩系美食，偏爱海滨小城，不想在超高压大城市生活的人。\n⚠️小缺点：冬季海风冷，发展机会远少于首尔。" }, { name:"槟城", desc:"🌿 宜居亮点：马来西亚老城，南洋美食天堂，物价亲民，华人多，语言压力小。\n✅适合：爱吃南洋风味，预算有限，想要轻松海外生活，害怕语言壁垒的人。\n⚠️小缺点：基础设施一般，夏天湿热蚊虫多。" }, { name:"尼斯", desc:"🌿 宜居亮点：法国蔚蓝海岸，地中海阳光，沙滩棕榈，老城浪漫，气候舒服。\n✅适合：向往南欧海滨浪漫，喜欢阳光，愿意享受休闲慢生活的人。\n⚠️小缺点：旅游城市物价高，旺季人满为患。" }, { name:"多伦多", desc:"🌿 宜居亮点：加拿大多元大城，华人社区完善，工作机会充足，城市包容度很高。\n✅适合：想要海外发展机会，重视多元包容，接受四季分明寒冷冬季的人。\n⚠️小缺点：冬天漫长严寒，房产税和生活开销不低。" }, { name:"西雅图", desc:"🌿 宜居亮点：被森林湖泊包围，科技机会多，咖啡馆文化浓厚，湿润绿意满满。\n✅适合：科技向、喜欢森林湖泊氛围，不讨厌阴雨湿润天气的人。\n⚠️小缺点：长期阴雨天，房价持续走高。" }, { name:"基督城", desc:"🌿 宜居亮点：新西兰南岛花园城市，平整安静，离冰川湖泊很近，人很少。\n✅适合：社恐、热爱旷野自然，想要极低密度安静生活的人。\n⚠️小缺点：城市很小，娱乐极少，发展机会匮乏。" }, { name:"巴塞罗那", desc:"🌿 宜居亮点：高迪建筑、地中海阳光，热闹市集，美食丰富，热情松弛。\n✅适合：外向喜欢热闹，热爱艺术建筑，偏爱热烈鲜活城市氛围的人。\n⚠️小缺点：游客巨多，夏季燥热，小偷问题需要留意。" }, { name:"札幌", desc:"🌿 宜居亮点：北海道大城，雪季浪漫，海鲜乳制品好吃，夏天凉爽不闷热。\n✅适合：喜欢冬天雪景，怕酷暑，偏爱干净安静、清淡日料的人。\n⚠️小缺点：冬天漫长寒冷，日照短。" }, { name:"琅勃拉邦", desc:"🌿 宜居亮点：老挝慢城，湄公河畔，古寺宁静，物价极低，日出布施温柔治愈。\n✅适合：追求极简精神松弛，物质欲望低，喜欢安静禅意氛围的人。\n⚠️小缺点：配套简陋，医疗差，发展机会几乎没有。" }, { name:"阿德莱德", desc:"🌿 宜居亮点：澳洲宝藏小城，葡萄酒产区，阳光充足，人少安静，物价友好。\n✅适合：喜欢葡萄酒、田园慢生活，不爱拥挤大城市的人。\n⚠️小缺点：位置偏僻，航班少，文娱活动有限。" }, { name:"波尔图", desc:"🌿 宜居亮点：葡萄牙酒乡老城，杜罗河穿城，红酒、石板街巷，物价很低。\n✅适合：喜欢复古老城，爱葡萄酒，预算有限想在欧洲慢生活的人。\n⚠️小缺点：薪资偏低，冬季多雨阴冷。" }, { name:"冲绳那霸", desc:"🌿 宜居亮点：日本南国海岛，碧海蓝天，气候温暖，日式秩序+海岛松弛。\n✅适合：喜欢干净日系氛围，又放不下大海阳光，讨厌寒冬的人。\n⚠️小缺点：地方小，就业选择少，台风季麻烦。" }, { name:"吉隆坡", desc:"🌿 宜居亮点：马来西亚首都，华人多，美食混杂南洋、中式，物价友好，城市繁华。\n✅适合：想要海外便利都市生活，不想承担欧美高成本，适应湿热的人。\n⚠️小缺点：交通拥堵，夏天湿热，空气质量不稳定。" }, { name:"哥本哈根", desc:"🌿 宜居亮点：丹麦幸福城市，骑行友好，极简设计感，社会福利完善，干净安宁。\n✅适合：喜欢极简秩序，重视公共福利，享受低冲突平和氛围的人。\n⚠️小缺点：物价超高，冬天短暂阴冷，税高。" }, { name:"爱丁堡", desc:"🌿 宜居亮点：苏格兰山城，古堡、海风，文学氛围浓厚，城市浪漫独特。\n✅适合：偏爱复古英伦，喜欢文学艺术，能接受多风阴雨天气的人。\n⚠️小缺点：风大阴冷，日照很短，物价偏高。" }, { name:"檀香山", desc:"🌿 宜居亮点：夏威夷海岛，全年温暖，碧海沙滩，热带氛围治愈力拉满。\n✅适合：海岛重度爱好者，喜欢常年夏天，愿意拥抱热带生活的人。\n⚠️小缺点：物价极高，远离大陆，出行成本贵。" }, { name:"里昂", desc:"🌿 宜居亮点：法国美食之都，老城温柔，比巴黎安静，物价友好很多。\n✅适合：热爱法式美食，喜欢欧洲老城，不想挤在巴黎喧嚣里的人。\n⚠️小缺点：冬季阴冷，薪资上限不如巴黎。" }, { name:"塔斯马尼亚霍巴特", desc:"🌿 宜居亮点：澳洲最南端，荒野海湾，人烟稀少，极光、原始森林，安静到治愈。\n✅适合：重度自然爱好者，享受孤独松弛，喜欢旷野小众风景的人。\n⚠️小缺点：交通闭塞，冬天寒冷，就业机会极少。" } ]; // 状态变量 let current = 0; let scoreArr = []; let selected = null; // 页面切换 function hideAll(){ document.getElementById('page-cover').classList.add('hidden'); document.getElementById('page-question').classList.add('hidden'); document.getElementById('page-result').classList.add('hidden'); } function startTest(){ hideAll(); document.getElementById('page-question').classList.remove('hidden'); current = 0; scoreArr = []; renderQuestion(); } function renderQuestion(){ selected = null; const q = questions[current]; document.getElementById('q-index').innerText = current+1; document.getElementById('q-title').innerText = q.title; const pct = ((current+1)/15 * 100).toFixed(1); document.getElementById('progress-bar').style.width = pct + "%"; const box = document.getElementById('option-box'); box.innerHTML = ""; q.opts.forEach((opt,idx)=>{ const div = document.createElement('div'); div.className = "p-3.5 rounded-xl border border-morandi-blue/60 btn-hover cursor-pointer"; div.innerText = opt.txt; div.onclick = ()=>{ selected = opt.score; // 清除其他选中 box.querySelectorAll("div").forEach(d=>d.classList.remove("bg-morandi-blue/40","border-morandi-blue")); div.classList.add("bg-morandi-blue/40","border-morandi-blue"); document.getElementById('next-btn').disabled = false; } box.appendChild(div); }) document.getElementById('next-btn').disabled = true; } function nextQuestion(){ if(!selected) return; scoreArr.push(selected); current++; if(current >= questions.length){ showResult(); return; } renderQuestion(); } function showResult(){ hideAll(); document.getElementById('page-result').classList.remove('hidden'); // 简易计分映射：统计ABCD频次，取最多的字符，映射到50个城市均匀分配 const count = {A:0,B:0,C:0,D:0}; scoreArr.forEach(s=>count[s]++); let maxKey = 'A'; let maxVal = 0; for(let k in count){ if(count[k]>maxVal){ maxVal = count[k]; maxKey = k; } } // 根据A/B/C/D分成4组，再按总得分偏移索引，随机稳定分配（同一个答卷每次结果一致） let seed = 0; scoreArr.forEach((s,i)=>seed += (s.charCodeAt(0)*(i+1))); const idx = seed % 50; const city = cityResult[idx]; document.getElementById('city-name').innerText = city.name; document.getElementById('city-desc').innerText = city.desc; } function restartTest(){ hideAll(); document.getElementById('page-cover').classList.remove('block'); document.getElementById('page-cover').classList.add('block'); } </script> </body> </html>
